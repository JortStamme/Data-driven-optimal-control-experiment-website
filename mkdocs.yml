
site_name: Research Internship Experiments
site_description: Experimental validation of data-driven and model-based control methods
# Add this to enable math formatting and image resizing
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

# Add this to load the MathJax script that actually draws the math
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md

  - Data-driven methods:
      - experiments/datadriven/index.md
      - Inertia Disc:
          - experiments/datadriven/inertiadisc/index.md
          - SW 5: experiments/datadriven/inertiadisc/sw5.md
          - SW 50: experiments/datadriven/inertiadisc/sw50.md
          - Chirp: experiments/datadriven/inertiadisc/chirp.md
      - Pendulum:
          - experiments/datadriven/pendulum/index.md
          - Probing Signal: experiments/datadriven/pendulum/probingsignal.md
          - Robustness Test: experiments/datadriven/pendulum/robustnesstest.md

  - Model-based methods:
      - experiments/modelbased/index.md
      - Baseline controllers:
          - experiments/modelbased/baseline/index.md
          - Guaranteed-Cost Design: experiments/modelbased/baseline/guaranteed-cost.md
          - Guaranteed Gain Error Design: experiments/modelbased/baseline/guaranteedgainerror.md
          - sPI Algorithm: experiments/modelbased/baseline/sPI.md
      - \(\alpha\) Sweep:
          - experiments/modelbased/alphasweep/index.md
          - Guaranteed-Cost Design: experiments/modelbased/alphasweep/guaranteedcostsweep.md
          - Guaranteed Gain Error Design: experiments/modelbased/alphasweep/guaranteedgainsweep.md
      - \(\gamma\) Sweep:
          - experiments/modelbased/gammasweep/index.md
